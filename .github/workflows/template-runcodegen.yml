name: Run CodeGen

on:
  workflow_call:
    inputs:
      vmImage:
        required: false
        default: 'windows-latest'
        type: string

jobs:
  codegen:
    name: Run CodeGen
    runs-on: ${{ inputs.vmImage }}
    steps:
    - name: setup git
      run: |
        git config --global core.autocrlf false
        git config --global core.filemode false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: yarn install
      run: yarn install

    - uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

    - name: NuGet restore
      run: nuget restore -LockedMode package\windows\ReactNativeXaml.sln

    - name: run CodeGen
      run: dotnet run --project Codegen --no-launch-profile -- -verbose -winmd '%USERPROFILE%\.nuget\packages\microsoft.ui.xaml\2.8.0\lib\uap10.0\Microsoft.UI.Xaml.winmd'
      working-directory: package

    - name: build TS
      run: yarn build

    - name: verify no changes from CodeGen
      shell: powershell
      run: |
        $changed = git status --porcelain=v1 package/
        $changed
        if ($changed -ne $null) { throw "CodeGen detected changes" }