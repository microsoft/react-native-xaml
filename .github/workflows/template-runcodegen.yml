name: Run CodeGen

on:
  workflow_call:
    inputs:
      vmImage:
        required: false
        default: 'windows-latest'
        type: string

jobs:
  codegen:
    name: Run CodeGen
    runs-on: ${{ inputs.vmImage }}
    steps:
    - name: setup git
      run: |
        git config --global core.autocrlf false
        git config --global core.filemode false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: yarn install
      run: yarn install

    - uses: nuget/setup-nuget@b26b823c478ee115be5c9403e62c90b0bf943843 # v3.1.0

    - name: NuGet restore
      run: nuget restore -LockedMode package\windows\ReactNativeXaml.sln

    - name: run CodeGen
      run: yarn codegen
      working-directory: package

    - name: build TS
      run: yarn build

    - name: verify no changes from CodeGen
      shell: powershell
      run: |
        $changed = git status --porcelain=v1 package/
        $changed
        if ($changed -ne $null) { throw "CodeGen detected changes" }