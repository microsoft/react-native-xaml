name: Test CLI

on:
  workflow_call:
    inputs:
      vmImage:
        required: false
        default: 'windows-latest'
        type: string
      rnwVersion:
        required: false
        default: 'latest'
        type: string
      useRnwWindowsInit:
        required: false
        default: false
        type: boolean

jobs:
  testcli:
    name: New RNW@${{ inputs.rnwVersion }} App
    runs-on: ${{ inputs.vmImage }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: yarn install
      run: yarn install

    - name: build TS
      run: yarn build

    - name: yarn link
      run: yarn link
      working-directory: package

    - name: determine RN versions
      run: |
        $rnwVersion = & npm show react-native-windows@${{ inputs.rnwVersion }} version
        if ($LASTEXITCODE -ne 0) { throw "Failed to resolve React Native Windows version" }
        $rnRange = & npm show react-native-windows@$rnwVersion peerDependencies.react-native
        if ($LASTEXITCODE -ne 0) { throw "Failed to resolve React Native version range" }
        $rnVersions = & npm show "react-native@$rnRange" version --json | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) { throw "Failed to resolve React Native version" }
        $rnVersion = @($rnVersions)[-1]
        if ($rnVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Expected a concrete React Native version, got '$rnVersion'" }
        echo "RNW_VERSION=$rnwVersion" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        echo "RN_VERSION=$rnVersion" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Using react-native-windows@$rnwVersion with react-native@$rnVersion"

    - name: create react-native app
      run: |
        Write-Host "Using react-native@$Env:RN_VERSION"
        npx @react-native-community/cli init testrnx --version $Env:RN_VERSION --skip-install --install-pods false --verbose --skip-git-init
      working-directory: ../

    - name: yarn install
      run: yarn install
      working-directory: ../testrnx

    - name: react-native-windows-init
      if: ${{ inputs.useRnwWindowsInit }}
      run: |
        Write-Host "Using react-native-windows@$Env:RNW_VERSION"
        npx --yes react-native-windows-init --overwrite --verbose --version $Env:RNW_VERSION
        yarn install
      working-directory: ../testrnx

    - name: react-native init-windows
      if: ${{ !inputs.useRnwWindowsInit }}
      run: |
        Write-Host "Using react-native-windows@$Env:RNW_VERSION"
        yarn add react-native-windows@$Env:RNW_VERSION
        yarn install
        npx @react-native-community/cli@latest init-windows --overwrite --logging
        yarn install
      working-directory: ../testrnx

    - name: add react-native-xaml
      run: |
        yarn add react-native-xaml
        yarn link react-native-xaml
        yarn install
      working-directory: ../testrnx

    - name: autolink
      run: npx @react-native-community/cli autolink-windows --logging
      working-directory: ../testrnx

    - name: build app
      run: npx @react-native-community/cli run-windows --no-launch --no-deploy --no-packager --logging
      working-directory: ../testrnx
